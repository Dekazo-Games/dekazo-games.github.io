<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dekazo Games</title>
<meta name="description" content="Dekazo Games: Dede's Village — Karadeniz köyünde araba tamiri ve köy hayatı.">
<meta property="og:title" content="Dekazo Games">
<meta property="og:description" content="Dede's Village — Karadeniz köyünde araba tamiri ve köy hayatı.">
<meta property="og:image" content="https://dekazo-games.github.io/img/kapak.jpg">
<meta name="theme-color" content="#1d2a1f">
<link rel="icon" href="img/simge.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Luckiest+Guy&display=swap" rel="stylesheet">
<style>
  :root { --bg: #17201a; --panel: #24301f; --line: #3c4c34; --krem: #f4ead2; --soluk: #c9c0a8; --turuncu: #f0a032; --turuncu2: #d9831c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--krem); font-family: 'Baloo 2', system-ui, sans-serif; }
  body { padding: calc(28px + env(safe-area-inset-top)) 16px 28px; }
  .wrap { max-width: 560px; margin: 0 auto; text-align: center; }
  .logo { font-family: 'Luckiest Guy', sans-serif; font-size: 40px; letter-spacing: 1px; margin: 0; }
  .logo span { display: block; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 15px; letter-spacing: 8px; color: var(--turuncu); }
  .kart { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; margin-top: 26px; text-align: left; }
  .kart img { width: 100%; display: block; }
  .ic { padding: 16px 18px 20px; }
  h2 { margin: 0 0 4px; font-size: 22px; }
  p { color: var(--soluk); margin: 0 0 16px; line-height: 1.45; }
  a.btn { display: block; text-align: center; text-decoration: none; font-weight: 800; font-size: 18px; color: #2a1a05; background: linear-gradient(#f6b24c, var(--turuncu2)); border-radius: 14px; padding: 14px; box-shadow: 0 4px 0 #8a4f0c; }
  footer { color: #8d8672; font-size: 13px; margin-top: 24px; line-height: 1.7; }
  footer a { color: #b5ac93; }
</style>
</head>
<body>
<div class="wrap">
  <h1 class="logo">DEKAZO<span>GAMES</span></h1>
  <div class="kart">
    <img src="img/kapak.jpg" alt="Dede's Village">
    <div class="ic">
      <h2>Dede's Village</h2>
      <p>Karadeniz'de gerçek bir köyde araba tamiri ve köy hayatı. Şu an ücretsiz erken erişim testinde: iPhone, Android ve Windows.</p>
      <a class="btn" href="test/">Teste katıl</a>
    </div>
  </div>
  <footer>
    <a href="https://www.instagram.com/dedesvillagegame/">Instagram</a> · <a href="https://dekazogames.itch.io/dedes-village">itch.io</a> · <a href="mailto:dekazogames@gmail.com">dekazogames@gmail.com</a><br>
    <a href="https://zobarkaan.github.io/dedesvillage-gizlilik/">Gizlilik politikası</a> · © 2026 Dekazo Games
  </footer>
</div>
</body>
</html>
